[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joist"
version = "0.1.0"
description = "Build HTML UI with Python dataclasses + Jinja2 templates, with first-class HTMX support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

authors = [
  { name = "Eric Wong", email = "ericsyw@gmail.com" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Template Systems",
  "Framework :: Jinja2",
]

dependencies = [
  "jinja2>=3.1",
  "markupsafe>=2.1",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.115",
  "starlette>=0.40",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/manyoo/joist"
Source = "https://github.com/manyoo/joist"

[tool.setuptools.packages.find]
where = ["src"]
include = ["joist*"]

[tool.setuptools.package-data]
joist = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
